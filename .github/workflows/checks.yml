# Schnelle Prüfungen ohne REDAXO bei jedem Push und Pull Request.
name: Prüfungen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  optional:
    name: Ohne YForm ladbar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: php tools/check-optional.php
